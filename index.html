<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medication List via Voice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <h1>Medication List Builder</h1>
        <p>Tap the button, speak your medication instructions, and review the structured list.</p>
      </header>

      <section class="voice-panel">
        <button id="record-btn" type="button" class="record-btn">🎙️ Click to talk</button>
        <p id="status" role="status" aria-live="polite" class="status">Press the button to start listening.</p>
        <div class="transcript">
          <h2>Live transcript</h2>
          <p id="transcript-text">(nothing captured yet)</p>
        </div>
      </section>

      <section class="list-panel">
        <div class="panel-header">
          <h2>Medication list</h2>
          <button id="clear-btn" type="button" class="link-btn">Clear list</button>
        </div>
        <div id="list-empty" class="empty-state">Speak a medication to see it listed.</div>
        <ol id="med-list" class="med-list" aria-live="polite"></ol>
      </section>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
